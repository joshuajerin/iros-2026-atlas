# Copy this file outside the repository as ~/.cloudflared/config.yml and replace
# the placeholders. The public hostname must match IROS_ATLAS_PUBLIC_URL.
tunnel: YOUR_TUNNEL_UUID
credentials-file: /home/YOUR_USER/.cloudflared/YOUR_TUNNEL_UUID.json

ingress:
  - hostname: mcp.example.com
    service: http://127.0.0.1:8080
  - service: http_status:404
